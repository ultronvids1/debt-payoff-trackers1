<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Debt Payoff Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <div class="logo">💗 Debt Payoff Tracker</div>
    <a href="quiz.html" class="btn primary">Start the tracker</a>
  </div>
</header>

<section class="hero">
  <div class="hero-text">
    <h1>Become debt‑free faster — with a plan you'll actually stick to.</h1>
    <p>Add your debts, pick Snowball or Avalanche, and instantly see your debt‑free date.</p>
    <a href="quiz.html" class="btn primary">Start the tracker</a>
  </div>
</section>

<section id="tracker" class="tracker" hidden>
  <h2>Your Personalized Plan</h2>

  <label>Method</label>
  <select id="methodSelect">
    <option value="snowball">Snowball</option>
    <option value="avalanche">Avalanche</option>
  </select>

  <br><br>

  <label>Extra Monthly Payment</label>
  <input type="number" id="extraPayment" value="200"/>

</section>

<script>
window.addEventListener("DOMContentLoaded", function(){

  const quizDone = localStorage.getItem("quizCompleted");
  const method = localStorage.getItem("recommendedMethod");

  if(quizDone === "true" && method){

    document.getElementById("tracker").hidden = false;

    const select = document.getElementById("methodSelect");
    if(select){
      select.value = method;
    }

    document.getElementById("tracker").scrollIntoView({behavior:"smooth"});

    localStorage.removeItem("quizCompleted");
  }

});
</script>

</body>
</html>
