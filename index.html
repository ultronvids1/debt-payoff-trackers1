<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Debt Payoff Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="container">

<section id="quizIntro" class="card center">
<h1>Let’s Understand Your Situation</h1>
<p>This quick quiz helps us build the right debt plan for you. No finance knowledge needed.</p>
<button class="btn primary" id="startQuiz">Start</button>
</section>

<section id="quizSection" class="card" hidden>
<div class="progress">
<div id="progressBar"></div>
</div>
<div id="questionContainer"></div>
</section>

<section id="resultSection" class="card center" hidden>
<h2 id="resultTitle"></h2>
<p id="resultText"></p>
<button class="btn primary" onclick="applyResult()">Build My Plan</button>
</section>

<section id="tracker" class="card" hidden>
<h2>Your Plan</h2>
<label>Recommended Method</label>
<select id="methodSelect">
<option value="snowball">Snowball</option>
<option value="avalanche">Avalanche</option>
</select>
</section>

</div>

<script src="app.js"></script>
</body>
</html>
