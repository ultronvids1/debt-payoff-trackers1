<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Debt Payoff Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="container">

<section id="quizIntro" class="card center">
<h1>Build Your Debt-Free Plan</h1>
<p>Answer a few simple questions so we can personalize your payoff strategy.</p>
<button class="btn primary" id="startQuiz">Start Quiz</button>
</section>

<section id="quizSection" class="card" hidden>
<div class="progress"><div id="progressBar"></div></div>
<div id="questionContainer"></div>
</section>

<section id="resultSection" class="card center" hidden>
<h2 id="resultTitle"></h2>
<p id="resultText"></p>
<div id="emailCapture"></div>
</section>

<section id="tracker" class="card" hidden>
<h2>Your Personalized Debt Plan</h2>

<label>Recommended Method</label>
<select id="methodSelect">
<option value="snowball">Snowball</option>
<option value="avalanche">Avalanche</option>
</select>

<br><br>

<label>Extra Monthly Payment</label>
<input type="number" id="extraPayment" value="200"/>

<br><br>

<h3>Add a Debt</h3>
<input type="text" id="debtName" placeholder="Debt name"/>
<input type="number" id="debtBalance" placeholder="Balance"/>
<input type="number" id="debtMin" placeholder="Minimum payment"/>
<input type="number" id="debtRate" placeholder="Interest rate (%)"/>
<button class="btn primary" onclick="addDebt()">Add</button>

<ul id="debtList"></ul>

</section>

</div>

<script src="app.js"></script>
</body>
</html>
