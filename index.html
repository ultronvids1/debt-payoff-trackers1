<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Debt Payoff Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<header class="nav">
<div class="container nav-inner">
<div class="logo">Debt Payoff Tracker</div>
<a href="quiz.html" class="btn primary">Start Your Plan</a>
</div>
</header>

<section class="hero container">
<h1>Become debt‑free faster — with a plan you’ll actually stick to.</h1>
<p>Take a quick quiz and we’ll personalize your payoff strategy.</p>
<a href="quiz.html" class="btn primary large">Start the quiz</a>
</section>

<section id="tracker" class="container card" hidden>
<h2>Your Personalized Plan</h2>

<label>Recommended Method</label>
<select id="methodSelect">
<option value="snowball">Snowball</option>
<option value="avalanche">Avalanche</option>
</select>

<br><br>

<label>Extra Monthly Payment</label>
<input type="number" id="extraPayment" value="200"/>

<br><br>

<h3>Add a Debt</h3>
<input type="text" id="debtName" placeholder="Debt name"/>
<input type="number" id="debtBalance" placeholder="Balance"/>
<input type="number" id="debtMin" placeholder="Minimum payment"/>
<input type="number" id="debtRate" placeholder="Interest rate (%)"/>
<button class="btn primary" onclick="addDebt()">Add</button>

<ul id="debtList"></ul>
</section>

<script src="tracker.js"></script>
</body>
</html>
