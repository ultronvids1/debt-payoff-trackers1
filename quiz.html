<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Debt Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="container">

<section id="quizIntro" class="card center">
<h1>Let’s Build Your Debt Plan</h1>
<p>Answer a few simple questions.</p>
<button class="btn primary" id="startQuiz">Start</button>
</section>

<section id="quizSection" class="card" hidden>
<div class="progress"><div id="progressBar"></div></div>
<div id="questionContainer"></div>
</section>

<section id="resultSection" class="card center" hidden>
<h2 id="resultTitle"></h2>
<p>Enter your email to unlock your personalized plan.</p>
<input type="email" id="userEmail" placeholder="Enter your email">
<br><br>
<button class="btn primary" onclick="unlockTracker()">Unlock My Plan</button>
</section>

</div>

<script src="quiz.js"></script>
</body>
</html>
